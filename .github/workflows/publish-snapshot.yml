name: publish snapshot on maven

on: [workflow_dispatch]

jobs:
  publish:
    if: ${{ github.repository_owner == 'saicone' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 25

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish snapshot to Maven
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_maven.publish.username: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_maven.publish.password: ${{ secrets.MAVEN_PASSWORD }}
