description = 'MScript API'

repositories {
    maven { url = uri('https://repo.opencollab.dev/main/') }
}

dependencies {
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    compileOnly 'io.github.miniplaceholders:miniplaceholders-api:3.2.0'

    testImplementation(platform('org.junit:junit-bom:5.14.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    testImplementation 'net.kyori:adventure-api:4.26.1'
    testImplementation 'net.kyori:adventure-text-minimessage:4.26.1'
    testImplementation 'net.kyori:adventure-text-serializer-legacy:4.26.1'
    testImplementation 'net.kyori:adventure-text-serializer-plain:4.26.1'
    testImplementation 'com.saicone:types:1.4.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    failOnNoDiscoveredTests = false
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                afterEvaluate {
                    description = "Script interpreter for Minecraft projects"
                }
            }
        }
    }
}
