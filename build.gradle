import org.gradle.api.attributes.java.TargetJvmVersion

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://central.sonatype.com/repository/maven-snapshots') }
        maven { url = uri('https://libraries.minecraft.net') }
        maven { url = uri('https://repo.codemc.io/repository/nms/') }
        maven { url = uri('https://jitpack.io') }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    apply from: "$rootDir/gradle/publish-config.gradle"

    // Override the target JVM version on all configurations
    // This allows to use dependencies that require a higher JVM version than the project itself
    configurations.configureEach {
        if (canBeResolved) {
            attributes {
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
    }

    dependencies {
        compileOnlyApi 'net.kyori:adventure-api:4.26.1'
        compileOnlyApi 'net.kyori:adventure-text-minimessage:4.26.1'
        compileOnlyApi 'net.kyori:adventure-text-serializer-legacy:4.26.1'
        api 'com.saicone:types:1.4.3'

        compileOnly 'org.jetbrains:annotations:26.1.0'

        compileOnly fileTree(dir: 'libs', includes: ['*.jar'])
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    java {
        // Also set the toolchain language version to a higher version
        toolchain.languageVersion.set(JavaLanguageVersion.of(25))
        withSourcesJar()
        withJavadocJar()
    }

    // But compile the project itself in a lower version for compatibility purposes
    // This configuration will not collide with the toolchain language version, since we previously set the target JVM version on all configurations
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    javadoc {
        options {
            links 'https://docs.oracle.com/en/java/javase/21/docs/api/'
            // adventure
            links 'https://jd.advntr.dev/api/4.26.1/'
            links 'https://jd.advntr.dev/text-minimessage/4.26.1/'
            // annotations
            links 'https://javadoc.io/doc/org.jetbrains/annotations/26.1.0/'
            // types
            links 'https://javadoc.saicone.com/types/'
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                artifactId = 'mscript-' + project.name

                pom {
                    afterEvaluate {
                        description = "Module \"${project.name}\" of mscript"
                    }
                }
            }
        }
    }
}

def javadocProjects = [
        ':api',
        ':platform-bukkit',
        ':platform-bungeecord',
        ':platform-velocity',
]

tasks.register('allJavadoc', Javadoc) {
    group = 'documentation'

    source javadocProjects.collect {
        project(it).sourceSets.main.allJava
    }
    classpath = files(
            javadocProjects.collect {
                project(it).sourceSets.main.compileClasspath
            }
    )
    javadocTool.set(javaToolchains.javadocToolFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })

    options {
        def allLinks = javadocProjects.collect { projectPath ->
            project(projectPath).javadoc.options.links
        }.flatten().unique()
        allLinks.each { link -> links link }
    }

    destinationDirectory = layout.buildDirectory.dir('docs/all-javadoc')
}
